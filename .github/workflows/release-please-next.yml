name: release-please-next

on:
  push:
    branches: [next]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish without a new release (use to retry failed publishes)"
        type: boolean
        default: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: next

  publish-npm-next:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || inputs.force_publish == true }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm i -g npm@11.5.2

      - name: Install dependencies
        run: bun install

      - name: Sync internal dependency pins (normalize workspace specs)
        run: node scripts/normalize-workspace-deps.mjs

      - name: Verify publishable manifests (fail closed on workspace specs or stale pins)
        run: node scripts/check-publish-manifests.mjs

      - name: Build all packages
        run: bun run build

      # Publish steps fail closed (issue #3150): `set -eo pipefail` propagates
      # npm's exit status through tee, and any publish failure fails the job.
      # The historical `... | tee; grep -q 'E403|already exists' && echo || cat`
      # form exited 0 on EVERY failure (pipeline status was tee's; the trailing
      # compound always succeeded) — the silent-skip class that froze
      # core@8.0.0-beta.0 on the next dist-tag. The E403/already-exists
      # tolerance is retained ONLY for explicit force_publish retries
      # (workflow_dispatch with force_publish=true), where unchanged versions
      # are expected to skip.
      - name: Publish @opencode-swarm/telemetry (next)
        run: |
          set -eo pipefail
          cd packages/telemetry
          if ! npm publish --tag next --access public 2>&1 | tee /tmp/pub.log; then
            if [ "${{ inputs.force_publish }}" = "true" ] && grep -q 'E403\|already exists' /tmp/pub.log; then
              echo "Already published, skipping (force_publish retry)"
            else
              echo "::error::npm publish failed for @opencode-swarm/telemetry"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @opencode-swarm/core (next)
        run: |
          set -eo pipefail
          cd packages/core
          if ! npm publish --tag next --access public 2>&1 | tee /tmp/pub.log; then
            if [ "${{ inputs.force_publish }}" = "true" ] && grep -q 'E403\|already exists' /tmp/pub.log; then
              echo "Already published, skipping (force_publish retry)"
            else
              echo "::error::npm publish failed for @opencode-swarm/core"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @opencode-swarm/claude-code (next)
        run: |
          set -eo pipefail
          cd packages/claude-code
          if ! npm publish --tag next --access public 2>&1 | tee /tmp/pub.log; then
            if [ "${{ inputs.force_publish }}" = "true" ] && grep -q 'E403\|already exists' /tmp/pub.log; then
              echo "Already published, skipping (force_publish retry)"
            else
              echo "::error::npm publish failed for @opencode-swarm/claude-code"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish opencode-swarm (next)
        run: |
          set -eo pipefail
          cd packages/opencode
          if ! npm publish --tag next --access public 2>&1 | tee /tmp/pub.log; then
            if [ "${{ inputs.force_publish }}" = "true" ] && grep -q 'E403\|already exists' /tmp/pub.log; then
              echo "Already published, skipping (force_publish retry)"
            else
              echo "::error::npm publish failed for opencode-swarm"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
